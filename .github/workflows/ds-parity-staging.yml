name: DS parity staging checks (no APK)
on:
  push:
    branches: [ investigate/ds-pc-parity-staging-20261125 ]
permissions:
  contents: read
jobs:
  fast-regressions:
    name: Fast DS/UFC source and unit checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source (no dependency submodules)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1
      - name: Compile and run focused renderer, lighting and UFC policies
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            demons_stencil_alias_test
            saros_host_bank_placement_test
            saros_lazy_fold_reservation_test
            demons_full_frame_diff_test
            demons_depth_full_coverage_test
            demons_htile_meta_write_test
            demons_sampled_depth_metadata_test
            demons_htile_load_decision_test
            demons_sample_htile_clear_test
            demons_zero_new_image_test
            demons_color_write_mask_test
            demons_guest_color_targets_test
            demons_indirect_dispatch_test
            demons_lds_int64_storage_test
            demons_view_placement_test
            demons_rolling_probe_test
            demons_lighting_memory_policy_test
            demons_gpu_image_publish_policy_test
            ufc6_fan_policy_test
            ufc6_output_resolution_test
            thread_prime_preference_test
            descriptor_pool_policy_test
            compute_uncached_fill_policy_test
            process_watchdog_packet_batch_test
          )
          for test in "${tests[@]}"; do
            g++ -std=c++20 -Wall -Wextra -Werror -Isrc "tests/manual/${test}.cpp" -o "/tmp/${test}"
            "/tmp/${test}"
          done
      - name: Validate Count EXEC SPIR-V 1.3 and 1.4 instrumentation
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v spirv-val >/dev/null || ! test -f /usr/include/spirv/unified1/spirv.hpp; then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y spirv-tools spirv-headers
          fi
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc tests/manual/demons_count_exec_probe_test.cpp -o /tmp/ds-count-probe
          /tmp/ds-count-probe /tmp/ds-count-
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc tests/manual/demons_vertex_position_probe_test.cpp -o /tmp/ds-vertex-probe
          /tmp/ds-vertex-probe /tmp/ds-vertex-
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc tests/manual/demons_relight_probe_test.cpp -o /tmp/ds-relight-probe
          /tmp/ds-relight-probe /tmp/ds-relight-
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc tests/manual/demons_atlas_tile_history_test.cpp -o /tmp/ds-atlas-tile-history
          /tmp/ds-atlas-tile-history
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc tests/manual/demons_pc_render_parity_test.cpp -o /tmp/ds-pc-render-parity
          /tmp/ds-pc-render-parity
          for f in /tmp/ds-count-*.spv /tmp/ds-vertex-*.spv /tmp/ds-relight-*.spv; do
            echo "Validating $f"
            spirv-val --target-env vulkan1.3 "$f"
          done
      - name: Regress exact Saros folded guest mappings and 4 GiB host headroom
        shell: bash
        run: |
          set -euo pipefail
          # FEX REP memcpy/memset must use the same host bank as the ordinary
          # FEX memory IR pass and the kernel's folding function.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/cpu/patches/fex-addressfold.patch').read_text()
          assert p.count('Constant(FEXCore::GuestAddressFold::GetShift()))') == 4  # three REP + one InlineConstant IR
          assert "IREmit->_Constant(FEXCore::GuestAddressFold::GetShift())" in p
          assert "IREmit->_InlineConstant(FEXCore::GuestAddressFold::GetShift())" not in p
          assert '39u - __builtin_ctzll(FEXCore::GuestAddressFold::GetShift())' not in p
          assert '39u - std::countr_zero(FEXCore::GuestAddressFold::GetShift())' not in p
          PY
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Isrc tests/AddressFoldTests.cpp -o /tmp/address-fold-saros
          /tmp/address-fold-saros
      - name: Validate launch policies, Vulkan batch and GPU-side dispatch evidence
        run: |
          python3 scripts/android/check_descriptor_pool_contract.py
          python3 - <<'PY'
          from pathlib import Path
          launch = Path("android/app/src/main/java/com/kytyps5/android/LaunchConfig.kt").read_text()
          indirect = Path("src/graphics/host_gpu/renderer/renderIndirect.cpp").read_text()
          compute = Path("src/graphics/host_gpu/renderer/renderCompute.cpp").read_text()
          scheduler = Path("src/graphics/host_gpu/renderer/commandScheduler.cpp").read_text()
          shader = Path("src/graphics/host_gpu/shaders/indirect_draw_fixup.comp").read_text()
          assert 'KYTY_DS_LDS64_STORAGE=1' in launch
          assert 'KYTY_DS_START_INSTANCE_SGPR=1' in launch
          assert '"--sync-raw-image-buffers", "true"' in launch
          assert 'KYTY_UFC6_SUBMIT_BATCH=1' in launch
          assert 'KYTY_UFC6_DESCRIPTOR_REUSE=1' not in launch
          assert 'QueueSubmitBatch' in scheduler
          assert 'KYTY_GPU_PIPELINE=1' not in launch
          assert 'KYTY_PIPE_BATCH=1' not in launch
          assert 'eColorAttachmentWrite' in indirect and 'eDepthStencilAttachmentWrite' in indirect
          assert 'eColorAttachmentWrite' in compute and 'eDepthStencilAttachmentWrite' in compute
          assert '[DS_LIGHTING_GROUPS]' in indirect
          assert '[DS_LIGHTING_FEATURES]' in compute
          barrier = Path("src/graphics/shader/recompiler/backend/spirv/spirvEmitterFlow.cpp").read_text()
          assert 'spv::MemorySemanticsImageMemoryMask' in barrier
          assert 'std::ranges::any_of(state.program.info.buffers, written)' in barrier
          assert 'HostWords(params.feedback).words[axis + 1u] = groups' in shader
          assert 'const uint32_t x = words[1], y = words[2], z = words[3]' in indirect
          assert '[DS_BUFFER_PRODUCER]' in compute
          print("Focused Demon/UFC source contracts: OK")
          PY

