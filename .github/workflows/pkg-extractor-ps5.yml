name: Build PS4+PS5 PKG Extractor APK (Direct .pkg browser)
on:
  push:
    branches: [pkg-extractor-ps5-android]
    paths:
      - 'scripts/pkg-extractor-ps5/**'
      - '.github/workflows/pkg-extractor-ps5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        name: Checkout Android integration
      - name: Checkout original APK app
        run: |
          git clone https://github.com/not-so-vishal/pkg-extractor-android.git app-source
          git -C app-source checkout e7ca4f3d8b54d4f08eec8e9ebf5124570d19b2c9
      - name: Checkout PS5 Rust extractor
        run: |
          git clone https://github.com/awake-devel/pkg-to-anyps5.git rust-source
          git -C rust-source checkout 2e9b12267840f9777f8d825335c4b4938160d9c4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Integrate PS5 and prepare SDK
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/pkg-extractor-ps5/patch_sources.py app-source rust-source
          python3 scripts/pkg-extractor-ps5/patch_picker.py app-source
          python3 scripts/pkg-extractor-ps5/patch_large_fpkg.py rust-source
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "cmake;3.22.1" "ndk;27.2.12479018"
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang" >> "$GITHUB_ENV"
      - name: Regression test large PS5 FPKG metadata scanner
        run: |
          cd rust-source
          cargo test --lib metadata_scan_handles_a_last_file_larger_than_one_gib
      - name: Build PS5 ARM64 native extractor
        shell: bash
        run: |
          set -euxo pipefail
          cd rust-source
          cargo build --release --lib --target aarch64-linux-android
          install -d ../app-source/app/src/main/jniLibs/arm64-v8a
          install -m 0644 target/aarch64-linux-android/release/libpkg_to_anyps5.so ../app-source/app/src/main/jniLibs/arm64-v8a/libps5extract.so
          file ../app-source/app/src/main/jniLibs/arm64-v8a/libps5extract.so
      - name: Compile APK
        shell: bash
        run: |
          set -euxo pipefail
          cd app-source
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Collect APK and checksum
        run: |
          mkdir -p dist
          cp app-source/app/build/outputs/apk/debug/app-debug.apk dist/PKG-Extractor-PS4-PS5-Android-arm64-debug.apk
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PKG-Extractor-PS5-ARM64-APK
          path: dist/
          retention-days: 30
