name: Compatibility investigation — native only

# Do not build or publish an APK until BOTH title fixes have working backend
# implementations and device-test acceptance evidence. This workflow validates
# a focused source branch and never executes Gradle/NDK packaging.
on:
  push:
    branches: [investigate/wolverine-bindless-demons-jobs]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/compat-investigate.yml"
  workflow_dispatch:

# Only the newest source state needs expensive native compilation.
concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-and-unit:
    name: ARM64 FEX policy and Wolverine bindless source contract
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: native-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            native-ccache-${{ runner.os }}-
      - name: Compile and run actual Bluepoint poll thunk on x86 synthetic guest memory
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -O2 -Isrc \
            tests/DemonsSoulsIdleArm64Tests.cpp -o /tmp/ds-idle
          timeout 20 /tmp/ds-idle
      - name: Confirm old forced guest prefix mode is not silently enabled
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cp=Path("src/graphics/guest_gpu/graphicsRun.cpp").read_text()
          idle=Path("src/loader/demonsSoulsIdle.cpp").read_text()
          assert 'std::getenv("KYTY_DS_PC_BOUNDARY")' in cp
          assert 'pc_boundary[0] == \'1\'' in cp
          assert 'UseIdleBackoff(true, true' in idle
          assert 'SystemContentParamSfoGetString("TITLE_ID", &title)' in idle
          assert 'Matches(call,pollCode)' in idle
          print("Title- and signature-gated Bluepoint HLE policy: OK")
          PY
      - name: Compile source-level descriptor data policy; do NOT claim GPU correctness
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc \
            tests/manual/descriptor_pool_policy_test.cpp -o /tmp/descriptor-policy
          /tmp/descriptor-policy
      - name: Verify bindless port remains disabled until host and shader are both wired
        run: |
          python3 - <<'PY'
          from pathlib import Path
          header=Path("src/graphics/shader/recompiler/ShaderRecompiler.h").read_text()
          ir=Path("src/graphics/shader/recompiler/ir/ShaderIR.h").read_text()
          assert 'bool                        bindless_images            = false;' in header
          assert 'bindless_images' in ir
          assert 'bool                          bindless          = false;' in ir
          print("Bindless descriptor metadata staged (feature OFF, shader and host binder pending)")
          PY
      - name: Install host build dependencies for shader regression
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld ninja-build glslang-tools ccache \
            libasound2-dev libdbus-1-dev libgl1-mesa-dev libpulse-dev libudev-dev \
            libwayland-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev \
            libxi-dev libxkbcommon-dev libxrandr-dev libxss-dev libxtst-dev \
            pkg-config wayland-protocols
      - name: Restore pinned FFmpeg host archive
        uses: actions/cache@v4
        with:
          path: _Build/compat/externals/9ac4cfd195f1-ffmpeg-linux-x64.zip
          key: kyty-ffmpeg-host-9ac4cfd195f1-x64
      - name: Fetch FFmpeg through authenticated GitHub releases API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _Build/compat/externals
          output=_Build/compat/externals/9ac4cfd195f1-ffmpeg-linux-x64.zip
          if ! test -s "$output"; then
            gh release download 9ac4cfd195f1 \
              --repo KytyPS5/ext-ffmpeg-core \
              --pattern ffmpeg-linux-x64.zip \
              --output "$output"
          fi
          test -s "$output"
      - name: Verify descriptor indexing hardware thresholds without Vulkan device
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc \
            tests/manual/bindless_capability_test.cpp -o /tmp/bindless-capability
          /tmp/bindless-capability
      - name: Compile and test real shader resource specialization plus Bluepoint HLE
        run: |
          cmake -S . -B _Build/compat -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DKYTY_BUILD_LAUNCHER=OFF \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build _Build/compat --target \
            shader_recompiler_compute_tests resource_materialization_tests \
            demons_souls_idle_arm64_tests --parallel 2
          ctest --test-dir _Build/compat --output-on-failure --timeout 180 \
            -R '^(resource_materialization|demons_souls_idle_arm64)$'
          timeout 600 _Build/compat/shader_recompiler_compute_tests --compile-only
      - name: Compile complete Kyty emulator host so bindless Vulkan additions are type-checked
        run: cmake --build _Build/compat --target kyty_emulator --parallel 2
