name: Compatibility investigation — native only

# Fast DS/UFC source checks on push; full host compile/regressions only by
# manual workflow_dispatch. Neither job builds or publishes an APK.
on:
  push:
    branches: [investigate/wolverine-bindless-demons-jobs, test/wolverine-demons-android-20261105]
    paths:
      - ".github/workflows/compat-investigate.yml"
      - "src/graphics/**"
      - "tests/manual/**"
      - "android/app/src/main/java/com/kytyps5/android/LaunchConfig.kt"
  workflow_dispatch:

# Cancel obsolete quick checks; manual full regressions remain opt-in.
concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick-demons-ufc:
    name: Fast Demon lighting / UFC6 policy verification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1
      - name: Focused GPU memory, indirect dispatch and UFC6 policy tests
        shell: bash
        run: |
          set -euo pipefail
          for test in demons_view_placement_test demons_stencil_alias_test \
                      demons_indirect_dispatch_test demons_lds_int64_storage_test \
                      demons_lighting_memory_policy_test demons_gpu_image_publish_policy_test \
                      ufc6_fan_policy_test ufc6_output_resolution_test \
                      process_watchdog_packet_batch_test; do
            g++ -std=c++20 -Wall -Wextra -Werror -Isrc "tests/manual/${test}.cpp" -o "/tmp/${test}"
            "/tmp/${test}"
          done
      - name: Check actual GPU-side lighting measurements are connected
        run: |
          python3 - <<'PY'
          from pathlib import Path
          code = Path('src/graphics/host_gpu/renderer/renderIndirect.cpp').read_text()
          compute = Path('src/graphics/host_gpu/renderer/renderCompute.cpp').read_text()
          shader = Path('src/graphics/host_gpu/shaders/indirect_draw_fixup.comp').read_text()
          assert '[DS_LIGHTING_GROUPS]' in code
          assert 'source=gpu frame=%d' in code
          assert 'all 16 reserved GPU slots busy' in code
          assert 'source=cpu frame=%d' in compute
          assert 'feedback.frame >= 735' in code
          assert '[DS_LIGHTING_FEATURES]' in compute
          assert 'FeedbackWord(params.feedback).word = packed' in shader
          perf = Path('src/graphics/host_gpu/renderer/ufcPerf.cpp').read_text()
          graphics = Path('src/graphics/guest_gpu/graphicsRun.cpp').read_text()
          assert 'pm4_top_samples=' in perf
          assert 'UfcPerf::SamplePm4Handler()' in graphics
          assert 'UfcPerf::NotePm4Handler(opcode' in graphics
          print('Focused DS GPU workgroup and UFC6 handler-cost diagnostics: OK')
          PY

  source-and-unit:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Full host shader / Bluepoint regression compilation (manual only)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: native-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            native-ccache-${{ runner.os }}-
      - name: Validate independent Demon depth owners and UFC6 non-exclusive prime scheduling
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc \
            tests/manual/demons_view_placement_test.cpp -o /tmp/demons-distinct-depth
          /tmp/demons-distinct-depth
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc \
            tests/manual/thread_prime_preference_test.cpp -o /tmp/ufc-prime-preference
          /tmp/ufc-prime-preference
      - name: Validate per-depth stencil plane ownership
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc \
            tests/manual/demons_stencil_alias_test.cpp -o /tmp/demons-stencil-owners
          /tmp/demons-stencil-owners
      - name: Compile and run actual Bluepoint poll thunk on x86 synthetic guest memory
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -O2 -Isrc \
            tests/DemonsSoulsIdleArm64Tests.cpp -o /tmp/ds-idle
          timeout 20 /tmp/ds-idle
      - name: Confirm old forced guest prefix mode is not silently enabled
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cp=Path("src/graphics/guest_gpu/graphicsRun.cpp").read_text()
          idle=Path("src/loader/demonsSoulsIdle.cpp").read_text()
          assert 'std::getenv("KYTY_DS_PC_BOUNDARY")' in cp
          assert 'pc_boundary[0] == \'1\'' in cp
          assert 'UseIdleBackoff(true, true' in idle
          assert 'SystemContentParamSfoGetString("TITLE_ID", &title)' in idle
          assert 'Matches(call,pollCode)' in idle
          print("Title- and signature-gated Bluepoint HLE policy: OK")
          PY
      - name: Compile source-level descriptor data policy; do NOT claim GPU correctness
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc \
            tests/manual/descriptor_pool_policy_test.cpp -o /tmp/descriptor-policy
          /tmp/descriptor-policy
      - name: Verify bindless port remains disabled until host and shader are both wired
        run: |
          python3 - <<'PY'
          from pathlib import Path
          header=Path("src/graphics/shader/recompiler/ShaderRecompiler.h").read_text()
          ir=Path("src/graphics/shader/recompiler/ir/ShaderIR.h").read_text()
          assert 'bool                        bindless_images            = false;' in header
          assert 'bindless_images' in ir
          assert 'bool                          bindless          = false;' in ir
          print("Bindless descriptor metadata staged (feature OFF, shader and host binder pending)")
          PY
      - name: Install host build dependencies for shader regression
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld ninja-build glslang-tools ccache \
            libasound2-dev libdbus-1-dev libgl1-mesa-dev libpulse-dev libudev-dev \
            libwayland-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev \
            libxi-dev libxkbcommon-dev libxrandr-dev libxss-dev libxtst-dev \
            pkg-config wayland-protocols
      - name: Restore pinned FFmpeg host archive
        uses: actions/cache@v4
        with:
          path: _Build/compat/externals/9ac4cfd195f1-ffmpeg-linux-x64.zip
          key: kyty-ffmpeg-host-9ac4cfd195f1-x64
      - name: Fetch FFmpeg through authenticated GitHub releases API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _Build/compat/externals
          output=_Build/compat/externals/9ac4cfd195f1-ffmpeg-linux-x64.zip
          if ! test -s "$output"; then
            gh release download 9ac4cfd195f1 \
              --repo KytyPS5/ext-ffmpeg-core \
              --pattern ffmpeg-linux-x64.zip \
              --output "$output"
          fi
          test -s "$output"
      - name: Verify descriptor indexing hardware thresholds without Vulkan device
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc \
            tests/manual/bindless_capability_test.cpp -o /tmp/bindless-capability
          /tmp/bindless-capability
      - name: UFC6 non-flapping walk policy and performance source contract
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc \
            tests/manual/ufc6_fan_policy_test.cpp -o /tmp/ufc6-fan-policy
          /tmp/ufc6-fan-policy
          python3 - <<'PY'
          from pathlib import Path
          root = Path("src/graphics/host_gpu/renderer")
          launch = Path("android/app/src/main/java/com/kytyps5/android/LaunchConfig.kt").read_text()
          descriptors = (root / "pipeline/descriptors.cpp").read_text()
          reuse = (root / "pipeline/descriptorSetReuse.cpp").read_text()
          hdr = (root / "ufcPerf.h").read_text()
          probe = (root / "ufcPerf.cpp").read_text()
          assert 'KYTY_UFC6_DESCRIPTOR_REUSE=1' not in launch
          assert 'KYTY_UFC6_PERF=1' in launch
          assert 'KYTY_FAN_AUTO_ON_US=40' in launch
          assert 'DescriptorSetReuse::Hash' in descriptors
          assert 'm_descriptor_set_reuse.Find' in descriptors
          assert 'm_descriptor_set_reuse.Insert' in descriptors
          assert 'entry.tick != tick' in reuse
          assert 'm_descriptor_set_reuse' in (root / "render.h").read_text()
          for marker in ('Pm4', 'GpuQueueBlocked', 'VkQueueSubmit', 'TimelineWait',
                         'DescriptorPrepare', 'DescriptorUpdate', 'GarbageCollect'):
              assert marker in hdr, marker
          assert '[UFC6_PERF]' in probe
          assert 'vkQueueSubmit' not in probe
          assert '--perf-stats' not in launch[launch.index('KYTY_UFC6_PERF=1')-80:launch.index('KYTY_UFC6_PERF=1')+120]
          print("UFC6 profiling, exact descriptor set cache, fan policy: OK")
          assert 'KYTY_UFC6_SUBMIT_BATCH=1' in launch
          scheduler = (root / "commandScheduler.cpp").read_text()
          assert 'QueueSubmitBatch' in scheduler
          assert 'queue.submit(static_cast<uint32_t>(batch.size()), infos.data(), nullptr)' in scheduler
          assert 'm_master.MarkSubmitted(batch.back().tick)' in scheduler
          assert 'm_master.MarkSubmitted(pending.tick)' not in scheduler
          cache = (root / "cache/textureCache.cpp").read_text()
          assert 'GpuImagePublishPolicy::ChooseAlias(prior->gpu_write_order' in cache
          shader_regression = Path("tests/shaderCfgTests.cpp").read_text()
          assert 'TestNewShaderRecompilerVertexCpuIndirectBaseInstanceSgpr();' in shader_regression
          shader_metadata = Path("src/graphics/shader/shader.cpp").read_text()
          assert 'info.start_instance_sgpr = info.fetch_embedded ? start_instance_sgpr : -1;' in shader_metadata
          assert 'KYTY_DS_START_INSTANCE_SGPR=1' in launch
          cp = Path("src/graphics/guest_gpu/command_processor/pm4Handlers.cpp").read_text()
          vs = Path("src/graphics/shader/recompiler/frontend/translate/Translate.cpp").read_text()
          assert 'DsStartInstanceUserSgpr' in cp
          assert 'options.input_info.vertex->start_instance_sgpr >= 0' in vs
          assert 'StageInputKind::BaseInstance' in vs
          depth = Path("src/graphics/host_gpu/renderer/image/viewPlacementPolicy.h").read_text()
          assert 'requested.size != 0 && cached.size != 0' in depth
          assert 'KeepDistinctDepth' in cache
          assert 'ViewPlacementPolicy::KeepDistinctDepth(' in cache
          assert 'padded_depth_b' in Path("tests/manual/demons_view_placement_test.cpp").read_text()
          shader_key = Path("src/graphics/shader/shader.cpp").read_text()
          assert 'if (info.start_instance_sgpr >= 0)' in shader_key
          assert '0xd5000000u' in shader_key
          print("Demon distinct-depth ownership / title-only shader-cache keys: OK")
          assert '[DS_LIGHTING_GROUPS]' in Path('src/graphics/host_gpu/renderer/renderIndirect.cpp').read_text()
          assert 'params.padding = lighting ? 1u : 0u' in Path('src/graphics/host_gpu/renderer/renderIndirect.cpp').read_text()
          assert 'FeedbackWord(params.feedback).word = packed' in Path('src/graphics/host_gpu/shaders/indirect_draw_fixup.comp').read_text()
          assert '[DS_LIGHTING_FEATURES]' in Path('src/graphics/host_gpu/renderer/renderCompute.cpp').read_text()
          print("Demon GPU workgroup / actual shader feature evidence: wired")
          print("UFC6 Vulkan batching / Demon CPU-indirect SGPR wiring: OK")
          PY
      - name: Compile and test real shader resource specialization plus Bluepoint HLE
        run: |
          cmake -S . -B _Build/compat -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DKYTY_BUILD_LAUNCHER=OFF \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build _Build/compat --target \
            shader_cfg_tests shader_recompiler_compute_tests resource_materialization_tests \
            demons_souls_idle_arm64_tests --parallel 2
          ctest --test-dir _Build/compat --output-on-failure --timeout 180 \
            -R '^(shader_cfg|resource_materialization|demons_souls_idle_arm64)$'
          timeout 600 _Build/compat/shader_recompiler_compute_tests --compile-only
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc \
            tests/manual/demons_indirect_dispatch_test.cpp -o /tmp/demons-indirect-dispatch
          /tmp/demons-indirect-dispatch
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc \
            tests/manual/ufc6_output_resolution_test.cpp -o /tmp/ufc6-output-resolution
          /tmp/ufc6-output-resolution
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc \
            tests/manual/demons_lighting_memory_policy_test.cpp -o /tmp/demons-lighting-srt
          /tmp/demons-lighting-srt
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc \
            tests/manual/demons_gpu_image_publish_policy_test.cpp -o /tmp/demons-alias-owner
          /tmp/demons-alias-owner
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc \
            tests/manual/demons_view_placement_test.cpp -o /tmp/demons-view-placement
          /tmp/demons-view-placement
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc \
            tests/manual/compute_uncached_fill_policy_test.cpp -o /tmp/compute-uncached-fill
          /tmp/compute-uncached-fill
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("android/app/src/main/assets/presets/PPSA23566/nocrowd")
          manifest = json.loads((root / "preset.json").read_text())
          data = json.loads((root / "launch/ufc6_crowd_off.json").read_text())
          assert manifest["id"] == "nocrowd" and manifest["launch"]["gamePatch"] == "ufc6_crowd_off.json"
          assert data["version"] == "@ufc6-crowd-signatures-v1"
          writes = data["mods"][0]["memory"]
          expected = [
              (0x4a634ce, "47030000"), (0x4a63e94, "53010000"),
              (0x4a642a5, "ab010000"), (0x4a65da5, "a0010000")
          ]
          assert len(writes) == len(expected)
          for patch, (addr, disp) in zip(writes, expected):
              off = bytes.fromhex(patch["off"])
              on = bytes.fromhex(patch["on"])
              assert int(patch["offset"], 16) == addr and len(off) == len(on) == 13
              assert off == bytes.fromhex("83bf180e0000000f84" + disp)
              assert on == bytes.fromhex("83bf180e00000090e9" + disp)
          print("UFC6 no-crowd: exact 4 guarded 13-byte branches, no animation patch")
          PY
      - name: Compile complete Kyty emulator host so bindless Vulkan additions are type-checked
        run: cmake --build _Build/compat --target kyty_emulator --parallel 2
      - name: Java 21 for Android Kotlin preset regression tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test Android UFC6 crowd preset and Demons Souls launch flags (no APK)
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          ./gradlew --no-daemon testDebugUnitTest --console=plain \
            -PkytyNativeDir="$RUNNER_TEMP/kyty-native-tests"
