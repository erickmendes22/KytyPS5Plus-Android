name: P8 causal replay staging (no APK)
on:
  push:
    branches: [ staging/ds-v3-decision-gate-20261126 ]
    paths:
      - 'docs/android/tools/p8_*'
      - 'tests/manual/p8_*'
      - '.github/workflows/p8-causal-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  splice:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify causal experiment decision and negative controls
        run: |
          python3 tests/manual/p8_crossover_test.py
          python3 docs/android/tools/p8_native_replay.py selftest
      - name: Validate exact P8 guest-code export closure
        run: |
          curl --fail --silent --show-error --location https://repo.maven.apache.org/maven2/org/json/json/20180813/json-20180813.jar -o /tmp/p8-json.jar
          python3 tests/manual/test_ds_lighting_capture_export.py --json-jar /tmp/p8-json.jar
      - name: Verify indirect producer chain retention policy
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc tests/manual/demons_indirect_witness_test.cpp -o /tmp/ds-indirect-witness
          /tmp/ds-indirect-witness
      - name: Verify per-use transfer identity and exact raw-payload deduplication
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc tests/manual/p8_raw_store_test.cpp -o /tmp/p8-raw-store
          /tmp/p8-raw-store
      - name: Install host Vulkan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers
      - name: Actual Vulkan transfer regression (Lavapipe)
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Idocs/android/tools tests/manual/p8_splice_vk_test.cpp -lvulkan -o /tmp/p8-splice
          icd=$(find /usr/share/vulkan/icd.d -maxdepth 1 -name "lvp_icd*.json" -print -quit)
          test -n "$icd" && test -f "$icd"
          cat "$icd"
          VK_ICD_FILENAMES="$icd" VK_LOADER_DEBUG=error /tmp/p8-splice
      - name: Check pinned generated replay anchors
        run: |
          git init /tmp/gfxr
          git -C /tmp/gfxr remote add origin https://github.com/LunarG/gfxreconstruct.git
          git -C /tmp/gfxr fetch --depth=1 origin 4401228c791b11fb7ea15b93795cbd1e938307c0
          git -C /tmp/gfxr checkout --detach FETCH_HEAD
          python3 docs/android/tools/p8_patch_gfxr.py /tmp/gfxr
          git -C /tmp/gfxr diff --check

      - name: Compile patched replay consumer against pinned upstream headers
        run: |
          sudo apt-get install -y libx11-xcb-dev libxcb-keysyms1-dev libwayland-dev libxrandr-dev zlib1g-dev liblz4-dev libzstd-dev libxcb-glx0-dev ninja-build
          git -C /tmp/gfxr submodule update --init --recursive --depth=1
          cmake -S /tmp/gfxr -B /tmp/gfxr-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGFXRECON_ENABLE_OPENXR=OFF -DGFXRECON_TOCPP_SUPPORT=OFF -DBUILD_TESTING=OFF
          ninja -C /tmp/gfxr-build -t targets all > /tmp/gfxr-targets
          target=$(grep 'generated_vulkan_replay_consumer.cpp.o:' /tmp/gfxr-targets | head -1 | cut -d: -f1)
          test -n "$target"
          ninja -C /tmp/gfxr-build -j2 "$target"
