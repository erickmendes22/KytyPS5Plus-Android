name: Android APK

# Every push to android-boot-wip builds an APK exclusively as an Actions artifact.
# No GitHub Releases are created. Signing uses the repository's KYTY_* secrets.
on:
  push:
    branches: [ experiment/capy-global-render-scale, experiment/pc-fork-shader-performance, experimental/neptunia-game-category-resolution, experimental/neptunia-fex-lookup-cache, android-boot-wip, investigate/sh-short-memory, investigate/mfgt-fp64, investigate/mfgt-reference-port, investigate/mfgt-graphics-pipeline-crash, investigate/mfgt-spv-crash-capture, investigate/mfgt-vertex64-tess, recovery/mfgt-d43e258f-no-tess-workarounds, experiment/mfgt-written-image-reclaim, experiment/mfgt-memory-collector-v2 ]
    paths-ignore: [ 'docs/**', '**.md' ]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  NDK_VERSION: 28.2.13676358

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Reuse audited native core for Android-only changes
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 android/ci/reuse_native.py

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost
          df -h /

      - name: Host tools
        if: steps.native.outputs.reused != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslang-tools ccache

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android NDK
        if: steps.native.outputs.reused != 'true'
        run: |
          # sdkmanager occasionally downloads an incomplete ZIP from Google's CDN.
          # Retry the package installation rather than failing an otherwise valid native build.
          for attempt in 1 2 3; do
            if "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" < <(yes) > /dev/null &&
               test -f "$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}/source.properties"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Android NDK ${NDK_VERSION} failed to install after three attempts"
              exit 1
            fi
            echo "::warning::Android NDK install failed; retry ${attempt}/3"
            rm -rf "$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
            rm -rf "$HOME/.android/cache"
            sleep 5
          done
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: ccache
        if: steps.native.outputs.reused != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ github.sha }}
          restore-keys: ccache-android-

      - name: FFmpeg cache
        if: steps.native.outputs.reused != 'true'
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: _Build/ffmpeg-android/install
          key: ffmpeg-android-${{ hashFiles('scripts/android/build-ffmpeg-android.sh') }}-${{ env.NDK_VERSION }}

      - name: FFmpeg for Android
        if: steps.native.outputs.reused != 'true' && steps.ffmpeg.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK }}
        run: bash scripts/android/build-ffmpeg-android.sh "$PWD/_Build/ffmpeg-android"

      - name: Configure
        if: steps.native.outputs.reused != 'true'
        run: |
          cmake -S . -B _Build/android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-31 -DCMAKE_BUILD_TYPE=Release \
            -DKYTY_GUEST_CPU_FEX=ON -DKYTY_BUILD_LAUNCHER=OFF \
            -DFFMPEG_PREBUILT_DIR="$PWD/_Build/ffmpeg-android/install" \
            -DKYTY_BUILD_ORIGIN=Fork -DKYTY_BUILD_REPOSITORY="$GITHUB_REPOSITORY" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build native libraries
        if: steps.native.outputs.reused != 'true'
        run: |
          ccache --max-size=3G
          ninja -C _Build/android kyty_emulator
          ccache --show-stats

      - name: Stage native libraries
        if: steps.native.outputs.reused != 'true'
        run: |
          ST=$RUNNER_TEMP/native
          mkdir -p $ST/3rdparty/SDL3 $ST/3rdparty/libadrenotools/src/hook
          STRIP="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          "$STRIP" --strip-debug -o $ST/libmain.so _Build/android/libmain.so
          cp _Build/android/3rdparty/SDL3/libSDL3.so $ST/3rdparty/SDL3/
          cp _Build/android/3rdparty/libadrenotools/src/hook/*.so $ST/3rdparty/libadrenotools/src/hook/
          ls -la $ST $ST/3rdparty/SDL3 $ST/3rdparty/libadrenotools/src/hook

      - name: Version
        id: version
        run: |
          name="0.1.0"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KYTY_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KYTY_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Preserve fallback signing identity
        id: fallback_signing_cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kytyps5-plus-signing-v1

      - name: Select the cached fallback signing key explicitly
        if: env.KYTY_KEYSTORE_FILE == ''
        run: |
          fallback="$HOME/.android/debug.keystore"
          if [ ! -f "$fallback" ]; then
            if [ "${{ steps.fallback_signing_cache.outputs.cache-hit }}" = "true" ]; then
              echo "Cached signing key is missing; refusing to silently change identity"
              exit 1
            fi
            mkdir -p "$HOME/.android"
            keytool -genkeypair -keystore "$fallback" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore "$fallback" -storepass android -alias androiddebugkey
          echo "KYTY_KEYSTORE_FILE=$fallback" >> "$GITHUB_ENV"
          echo "KYTY_USE_FALLBACK_SIGNING=1" >> "$GITHUB_ENV"

      - name: Unit tests and APK
        working-directory: android
        env:
          KYTY_KEYSTORE_PASSWORD: ${{ secrets.KYTY_KEYSTORE_PASSWORD }}
          KYTY_KEY_ALIAS: ${{ secrets.KYTY_KEY_ALIAS }}
          KYTY_KEY_PASSWORD: ${{ secrets.KYTY_KEY_PASSWORD }}
        run: |
          if [ "${KYTY_USE_FALLBACK_SIGNING:-0}" = "1" ]; then
            export KYTY_KEYSTORE_PASSWORD=android KYTY_KEY_ALIAS=androiddebugkey KYTY_KEY_PASSWORD=android
          fi
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          ./gradlew --no-daemon testDebugUnitTest assembleRelease \
            -PkytyNativeDir="$RUNNER_TEMP/native" \
            -PkytyVersionCode=${{ steps.version.outputs.code }} \
            -PkytyVersionName=${{ steps.version.outputs.name }}
          out=app/build/outputs/apk/release
          apk=$(ls $out/*.apk | head -1)
          mv "$apk" "$GITHUB_WORKSPACE/KytyPS5-Plus-${{ steps.version.outputs.name }}.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Audit packaged native dependencies
        run: |
          python3 scripts/android/audit-apk.py KytyPS5-Plus-*.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Plus-${{ steps.version.outputs.name }}
          path: KytyPS5-Plus-*.apk


  native-regressions:
    name: Native regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes clang lld ninja-build glslang-tools ccache libasound2-dev libdbus-1-dev libgl1-mesa-dev libpulse-dev libudev-dev libwayland-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev libxkbcommon-dev libxrandr-dev libxss-dev libxtst-dev pkg-config wayland-protocols
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-native-tests-${{ github.sha }}
          restore-keys: ccache-native-tests-
      - name: Verify SIGKILL provenance filter
        run: |
          g++ -std=c++20 -pthread -Isrc tests/manual/signal_origin_probe.cpp -o /tmp/signal-origin-test
          timeout 30 /tmp/signal-origin-test
      - name: Configure host regression tests
        run: |
          ccache --max-size=2G
          cmake -S . -B _Build/regressions -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DKYTY_BUILD_LAUNCHER=OFF \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build audio, metadata and memory regressions
        run: cmake --build _Build/regressions --target shader_vertex_metadata_tests audio_out2_port_tests gpu_memory_budget_tests image_readback_chunk_tests sh_performance_patches_tests mfgt_index_transform_tests mfgt_arena_fix_tests kernel_file_system_tests address_fold_tests virtual_memory_allocation_tests --parallel 2
      - name: Test audio, metadata and memory
        run: ctest --test-dir _Build/regressions --output-on-failure --timeout 180 -R '^(shader_vertex_metadata|audio_out2_port|gpu_memory_budget|image_readback_chunk|sh_performance_patches|mfgt_index_transform|mfgt_arena_fix|kernel_mutex_headless|address_fold|virtual_memory_allocation)$'
      - name: Build shader regressions
        run: cmake --build _Build/regressions --target shader_cfg_tests shader_recompiler_compute_tests --parallel 2
      - name: Run shader regressions
        run: |
          ulimit -c 0
          ctest --test-dir _Build/regressions --output-on-failure --timeout 180 -R '^shader_cfg$'
          timeout 600 _Build/regressions/shader_recompiler_compute_tests --compile-only
          timeout 600 _Build/regressions/shader_recompiler_compute_tests --compile-only-fast-paths
      - name: Save native test compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-native-tests-${{ github.sha }}
      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-regression-results
          path: _Build/regressions/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
